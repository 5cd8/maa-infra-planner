<title>MAA 基地スケジュール作成</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1f2430;
  --muted: #6a7282;
  --border: #d5d9e2;
  --accent: #2f6fdb;
  --accent-text: #ffffff;
  --chip: #e8eefb;
  --error: #c0392b;
  --warn: #b7791f;
  --dim: 0.45;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d;
    --panel: #1d222b;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #353c49;
    --accent: #5b92f0;
    --accent-text: #0e1116;
    --chip: #2a3550;
    --error: #ff7b6b;
    --warn: #e5b45a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 "Yu Gothic UI", "Meiryo UI", system-ui, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
input[type="text"], select, textarea {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
}
input[type="text"] { min-width: 0; }
h2, h3 { margin: 0 0 6px; font-size: 15px; }
h3 { font-size: 14px; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; gap: 12px; padding: 12px; align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.topbar {
  display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
  padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.topbar .grow { flex: 1 1 180px; }
.status { color: var(--muted); font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.stack > * { margin-bottom: 8px; }
.muted { color: var(--muted); font-size: 12px; }
.drop-active { outline: 3px dashed var(--accent); outline-offset: -6px; }

.plan-item { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
.plan-item.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.facility-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
.period-row input { width: 5.5em; }

.facility-card { margin-bottom: 10px; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.room { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
.room.flash { outline: 2px solid var(--accent); }
.chips { display: flex; flex-direction: column; gap: 3px; margin: 4px 0; }
.chip { display: flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 6px; padding: 1px 4px 1px 8px; }
.chip .name { flex: 1; }
.chip button { padding: 0 6px; line-height: 1.3; }
.unresolved .name { color: var(--warn); }
.checks { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.disabled { opacity: 0.5; }

.issue { display: block; width: 100%; text-align: left; margin-bottom: 4px; border-left: 4px solid var(--border); }
.issue.error { border-left-color: var(--error); }
.issue.warn { border-left-color: var(--warn); }
.badge { display: inline-block; border-radius: 10px; padding: 0 8px; margin-right: 4px; font-size: 12px; border: 1px solid var(--border); }
.badge.error { color: var(--error); border-color: var(--error); }
.badge.warn { color: var(--warn); border-color: var(--warn); }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 14px; max-width: min(640px, 94vw); width: 94vw; }
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
.picker-list { max-height: 50vh; overflow: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; }
.pick-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; }
.pick-row.taken { opacity: var(--dim); }
.tag { font-size: 11px; border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; color: var(--muted); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.report ul { margin: 2px 0 8px; padding-left: 20px; max-height: 20vh; overflow: auto; }

</style>

        statusEl,
        h("input", { class: "grow", type: "text", "aria-label": "タイトル", placeholder: "タイトル", value: project.title, onInput: (e) => light(() => {
          project.title = e.target.value;
        }) }),
        h("input", { class: "grow", type: "text", "aria-label": "説明", placeholder: "説明", value: project.description, onInput: (e) => light(() => {
          project.description = e.target.value;
        }) })
      );
    }
    function renderAll() {
      if (state2.selected >= state2.project.plans.length) state2.selected = Math.max(0, state2.project.plans.length - 1);
      const p = plan();
      const left = h(
        "aside",
        { class: "panel" },
        h("h2", {}, "プラン"),
        planListEl,
        h(
          "div",
          { class: "row" },
          h("button", { onClick: () => update(() => {
            addPlan(state2.project);
            state2.selected = state2.project.plans.length - 1;
          }) }, "追加"),
          h("button", { disabled: !p, onClick: () => update(() => {
            duplicatePlan(state2.project, state2.selected);
            state2.selected += 1;
          }) }, "複製"),
          h("button", { "aria-label": "プランを上へ", disabled: !p || state2.selected === 0, onClick: () => update(() => {
            movePlan(state2.project, state2.selected, -1);
            state2.selected -= 1;
          }) }, "↑"),
          h("button", { "aria-label": "プランを下へ", disabled: !p || state2.selected >= state2.project.plans.length - 1, onClick: () => update(() => {
            movePlan(state2.project, state2.selected, 1);
            state2.selected += 1;
          }) }, "↓"),
          h("button", {
            disabled: !p || state2.project.plans.length <= 1,
            onClick: () => {
              if (window.confirm(`「${p.name}」を削除しますか？`)) update(() => removePlan(state2.project, state2.selected));
            }
          }, "削除")
        ),
        p && planForm(p)
      );
      const center = h(
        "main",
        { class: "stack" },
        p ? FACILITIES.filter((f) => p.rooms[f]).map((f) => roomCard(f, p.rooms[f], p)) : h("p", { class: "muted" }, "プランがありません"),
        p && FACILITIES.every((f) => !p.rooms[f]) && h("p", { class: "muted" }, "編集する施設が選ばれていません。左のフォームでオンにしてください。")
      );
      const right = h("aside", { class: "panel" }, validationEl);
      root2.replaceChildren(topBar(), h("div", { class: "layout" }, left, center, right));
      refreshSide();
    }
    return { renderAll, refreshSide };
  }

  // src/ui/main.js
  var nameIndex = createNameIndex(JSON.parse(document.getElementById("names").textContent));
  var dialog = document.getElementById("dialog");
  var root = document.getElementById("app");
  var backend = {
    getItem: (k) => window.localStorage.getItem(k),
    setItem: (k, v) => window.localStorage.setItem(k, v)
  };
  var storage = createStorage(backend);
  window.addEventListener("pagehide", () => storage.flush());
  var state = { project: createProject(), operbox: null, selected: 0 };
  var saved = storage.load();
  if (saved) {
    state.project = saved.project;
    if (saved.operbox) state.operbox = buildOperBox(saved.operbox.operators);
  }
  var view = createView(root, {
    state,
    nameIndex,
    changed: () => storage.save(state.project, state.operbox),
    openPicker: ({ title, taken, onPick }) => openPicker({ dialog, nameIndex, operbox: state.operbox, title, taken, onPick }),
    onLoadOperBox: () => chooseFile((text) => loadOperBox(text)),
    onImport: () => chooseFile((text) => loadPlan(text)),
    onLayout: () => openLayoutDialog({
      dialog,
      project: state.project,
      onApplyPreset: (name) => {
        applyPreset(state.project, name);
        touch();
      },
      onSetCount: (facility, n) => {
        setRoomCount(state.project, facility, n);
        touch();
      }
    }),
    onDownload: () => output((text) => {
      const blob = new Blob([text], { type: "application/json" });
      const link = h("a", { href: URL.createObjectURL(blob), download: `${state.project.title || "maa-infra"}.json` });
      link.click();
      URL.revokeObjectURL(link.href);
    }),
    onCopy: () => output((text) => Promise.resolve().then(() => navigator.clipboard.writeText(text)).then(
      () => notice("クリップボードにコピーしました。"),
      () => notice("コピーできませんでした。ダウンロードを使ってください。")
    )),
    onNew: () => {
      if (!window.confirm("現在の編集内容を破棄して新規作成しますか？")) return;
      state.project = createProject();
      state.selected = 0;
      touch();
    }
  });
  function touch() {
    storage.save(state.project, state.operbox);
    view.renderAll();
  }
  function notice(message) {
    dialog.replaceChildren(
      h("p", {}, message),
      h("div", { class: "dialog-actions" }, h("button", { class: "primary", onClick: () => dialog.close() }, "閉じる"))
    );
    dialog.showModal();
  }
  function output(write) {
    const errors = validate(state.project, nameIndex, state.operbox).filter((i) => i.level === "error").length;
    if (errors > 0 && !window.confirm(
      `検証エラーが${errors}件あります。時間帯(period)の形式が不正だと、MAAがファイル全体を読み込めません。それでも出力しますか？`
    )) {
      return;
    }
    write(exportPlan(state.project, nameIndex));
  }
  function chooseFile(handler) {
    const input = h("input", { type: "file", accept: ".json,application/json" });
    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (file) await handler(await file.text());
    });
    input.click();
  }
  function loadOperBox(text) {
    try {
      state.operbox = parseOperBox(text, nameIndex);
      touch();
    } catch (e) {
      notice(`OperBoxを読み込めませんでした: ${e.message}`);
    }
  }
  function loadPlan(text) {
    let result;
    try {
      result = importPlan(text, nameIndex);
    } catch (e) {
      notice(`JSONを取り込めませんでした: ${e.message}`);
      return;
    }
    openImportDialog({
      dialog,
      report: result.report,
      onConfirm: () => {
        state.project = result.project;
        state.selected = 0;
        touch();
      }
    });
  }
  function routeDropped(text) {
    let data;
    try {
      data = JSON.parse(text.replace(/^\uFEFF/, ""));
    } catch (e) {
      notice(`JSONとして読めませんでした: ${e.message}`);
      return;
    }
    if (Array.isArray(data)) loadOperBox(text);
    else if (data && Array.isArray(data.plans)) loadPlan(text);
    else notice("OperBox でも基地スケジュールでもないJSONです。");
  }
  window.addEventListener("dragover", (e) => {
    e.preventDefault();
    document.body.classList.add("drop-active");
  });
  window.addEventListener("dragleave", (e) => {
    if (e.target === document.documentElement) document.body.classList.remove("drop-active");
  });
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    document.body.classList.remove("drop-active");
    const file = e.dataTransfer?.files?.[0];
    if (file) routeDropped(await file.text());
  });
  view.renderAll();
})();

</script>
</body>
</html>
